name: Device packages

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - apps/android/**
      - apps/ios/**
      - .github/workflows/device-release.yml

permissions:
  contents: write

concurrency:
  group: health2609-device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Package Android (no tests)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          HEALTH2609_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HEALTH2609_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HEALTH2609_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/android
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            export HEALTH2609_KEYSTORE_PATH="$RUNNER_TEMP/android-release.jks"
            trap 'rm -f "$HEALTH2609_KEYSTORE_PATH"' EXIT
            umask 077
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$HEALTH2609_KEYSTORE_PATH"
            test -n "$HEALTH2609_KEYSTORE_PASSWORD" && test -n "$HEALTH2609_KEY_ALIAS" && test -n "$HEALTH2609_KEY_PASSWORD"
            gradle -p apps/android assembleRelease
            cp apps/android/app/build/outputs/apk/release/app-release.apk dist/android/yicanyidong-android-release.apk
          else
            gradle -p apps/android assembleDebug
            cp apps/android/app/build/outputs/apk/debug/app-debug.apk dist/android/yicanyidong-android-debug.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: device-android
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 7
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package iPhone/iPad for re-signing (no tests)
        env:
          IOS_VERSION: 0.4.2
          IOS_BUILD_NUMBER: 19
        run: |
          bash apps/ios/build-ipa.sh
          ENABLE_HEALTHKIT=1 bash apps/ios/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: device-ios
          path: dist/ios/*.ipa
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: device-*
          path: release-assets
          merge-multiple: true
      - name: Publish only real packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.4.2-device.${GITHUB_SHA:0:7}"
          cp docs/device-install.md release-assets/INSTALL.md
          (cd release-assets && sha256sum *.apk *.ipa > SHA256SUMS.txt)
          cat > /tmp/release-notes.md <<'NOTES'
          Android: signed APK, ready for device installation; artifact name identifies private release signing or temporary debug signing. Updating an older APK requires the same signer; preserve the old app and records until backup is confirmed.
          iPhone/iPad: unsigned arm64 device IPA for re-signing with a valid matching certificate/profile. Default resign package does not require HealthKit entitlement; manual and photo flows remain available. The optional healthkit IPA requires a profile authorizing HealthKit.
          Android/iOS include account-isolated encrypted local journals, portable private activity summaries, manual encrypted sync, recovery/password/device/key controls, and authenticated v2 records with legacy v1 reads. Queued edits stay bound to their initiating account; pending key rotation survives account logout.
          HarmonyOS 6 / OpenHarmony: real compiler-produced HAPs are published separately by the HAP workflow and require platform-specific signing for installation.
          This release was reviewed from source and packaged without running tests. Device behavior has not been verified.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --prerelease --title "一餐一动 0.4.2 · Android / iOS 安装包" --notes-file /tmp/release-notes.md
          fi
