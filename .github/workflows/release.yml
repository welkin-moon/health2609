name: 一餐一动 test release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Test release tag, e.g. v0.2.0-debug.20260929"
        required: true
        type: string
      api_base_url:
        description: "Worker API base URL, ending with /"
        required: false
        default: "https://h2609.lunarlab.uk/"
        type: string
  push:
    branches: [main]
    paths:
      - "demo/screenshots/**"
    tags:
      - "v*-debug.*"

permissions:
  contents: write

jobs:
  test-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Resolve metadata
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="$(find demo/screenshots -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -n1)"
          fi
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "screens=demo/screenshots/$TAG" >> "$GITHUB_OUTPUT"

      - name: Detect this version screenshots
        id: screenshots
        shell: bash
        run: |
          SCREEN_DIR="${{ steps.meta.outputs.screens }}"
          if compgen -G "$SCREEN_DIR/*.png" > /dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        env:
          INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
        shell: bash
        run: |
          API_BASE_URL="${INPUT_API_BASE_URL:-https://h2609.lunarlab.uk/}"
          gradle -p apps/android assembleDebug -PHEALTH2609_API_BASE_URL="$API_BASE_URL"
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "yicanyidong-${{ steps.meta.outputs.tag }}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: yicanyidong-${{ steps.meta.outputs.tag }}
          path: |
            yicanyidong-${{ steps.meta.outputs.tag }}-debug.apk
            ${{ steps.meta.outputs.screens }}/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          SCREEN_DIR="${{ steps.meta.outputs.screens }}"
          APK="yicanyidong-${TAG}-debug.apk"
          ASSETS=("$APK")
          if compgen -G "$SCREEN_DIR/*.png" > /dev/null; then
            ASSETS+=("$SCREEN_DIR"/*.png)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --prerelease --title "一餐一动 $TAG" --notes "一餐一动测试版：debug 签名 APK；如本版已采集实机演示图片则一并附带。"
          fi
