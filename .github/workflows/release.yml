name: Android competition APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Worker API base URL, ending with /"
        required: false
        default: "https://h2609.lunarlab.uk/"
        type: string
  push:
    tags:
      - "v*"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Build debug-signed competition APK
        env:
          INPUT_API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          API_BASE_URL="${INPUT_API_BASE_URL:-https://h2609.lunarlab.uk/}"
          gradle -p apps/android assembleDebug -PHEALTH2609_API_BASE_URL="$API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: health2609-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
