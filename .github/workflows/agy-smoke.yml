name: agy-smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/agy-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Public AGY health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 20 \
            https://h2609-agy.lunarlab.uk/healthz
          echo
