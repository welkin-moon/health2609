name: agy-smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/agy-bridge/**
      - services/api/src/integrations/agy/**
      - .github/workflows/agy-smoke.yml

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public AGY readiness
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --fail-with-body --silent --show-error --max-time 20             https://h2609-agy.lunarlab.uk/healthz)"
          echo "$body"
          printf '%s' "$body" | grep -q '"ok":true'
          printf '%s' "$body" | grep -q '"agyReady":true'
      - name: Exercise production multipart upload
        run: node tools/agy-bridge/smoke.mjs
