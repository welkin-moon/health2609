name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: health2609-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm check
      - run: pnpm test
      - run: node --check tools/agy-bridge/server.mjs
      - run: pnpm --filter @health2609/admin-web build
      - run: pnpm --filter @health2609/api exec wrangler deploy --dry-run --outdir dist
      - name: Stage deploy bundles
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p /tmp/health2609-admin
          cp -R apps/admin-web/dist/. /tmp/health2609-admin/
          cp services/api/dist/index.js /tmp/health2609-worker-index.js
      - uses: actions/upload-artifact@v4
        with:
          name: health2609-worker-bundle
          path: services/api/dist
          retention-days: 3
          if-no-files-found: error
      - name: Publish Admin static branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git checkout --orphan cf-admin-publish
          git rm -rf .
          cp -R /tmp/health2609-admin/. .
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
          git add index.html assets SOURCE_COMMIT
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build: admin static $GITHUB_SHA"
          git push --force origin HEAD:refs/heads/cf-admin
      - name: Publish Worker bundle branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git checkout --orphan cf-bundle-publish
          git rm -rf .
          cp /tmp/health2609-worker-index.js index.js
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
          git add index.js SOURCE_COMMIT
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "build: worker bundle $GITHUB_SHA"
          git push --force origin HEAD:refs/heads/cf-bundle
      - name: Smoke test deployed API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 https://h2609-admin.lunarlab.uk/ | grep -q 'health2609 管理台'
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 https://h2609.lunarlab.uk/healthz | grep -q '"ok":true'
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 \
            -H 'x-demo-role: admin' \
            -H 'x-demo-school: demo-school' \
            https://h2609.lunarlab.uk/v1/admin/classes | grep -q 'demo-class'
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 2 \
            -H 'x-demo-participant: demo-student' \
            https://h2609.lunarlab.uk/v1/student/schools | grep -q 'demo-school'

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - run: gradle -p apps/android assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: health2609-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
