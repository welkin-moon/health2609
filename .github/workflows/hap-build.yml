name: Harmony and OpenHarmony packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/harmony/**
      - apps/openharmony/**
      - tools/build-hap.mjs
      - .github/workflows/hap-build.yml
permissions:
  contents: write
concurrency:
  group: health2609-hap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [harmony, openharmony]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: ${{ runner.temp }}/harmony-tools
          key: harmony-commandline-linux-5.0.3.906-v1
      - name: Obtain Huawei command line SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL=https://repo.huaweicloud.com/harmonyos/ohpm/5.0.3/commandline-tools-linux-x64-5.0.3.906.zip
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 900 "$URL" -o /tmp/harmony-tools.zip
          curl --fail --location --retry 2 --max-time 60 "$URL.sha256" -o /tmp/harmony-tools.sha256
          CHECKSUM="$(tr -d '\r\n ' </tmp/harmony-tools.sha256)"
          [[ "$CHECKSUM" =~ ^[a-fA-F0-9]{64}$ ]]
          printf '%s  %s\n' "$CHECKSUM" /tmp/harmony-tools.zip | sha256sum --check
          unzip -q /tmp/harmony-tools.zip -d "$RUNNER_TEMP/harmony-tools"
          rm /tmp/harmony-tools.zip
      - uses: actions/cache/save@v4
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/harmony-tools
          key: harmony-commandline-linux-5.0.3.906-v1
      - name: Select SDK executables
        shell: bash
        run: |
          set -euo pipefail
          HVIGOR="$(find "$RUNNER_TEMP/harmony-tools" -path '*/hvigor/bin/hvigorw' -print -quit)"
          OHPM="$(find "$RUNNER_TEMP/harmony-tools" -path '*/ohpm/bin/ohpm' -print -quit)"
          test -n "$HVIGOR" && test -n "$OHPM"
          TOOLS="$(dirname "$(dirname "$(dirname "$HVIGOR")")")"
          chmod +x "$HVIGOR" "$OHPM"
          echo "HARMONY_COMMANDLINE_TOOLS=$TOOLS" >> "$GITHUB_ENV"
          echo "HVIGOR_EXECUTABLE=$HVIGOR" >> "$GITHUB_ENV"
          echo "OHPM_EXECUTABLE=$OHPM" >> "$GITHUB_ENV"
          if [[ -d "$TOOLS/tool/node/bin" ]]; then echo "$TOOLS/tool/node/bin" >> "$GITHUB_PATH"; fi
      - name: Configure Huawei build plugin registry
        run: |
          npm config set registry https://repo.huaweicloud.com/repository/npm/
          npm config set @ohos:registry https://repo.harmonyos.com/npm/
      - name: Inspect bundled build tool versions
        shell: bash
        run: |
          cat "$HARMONY_COMMANDLINE_TOOLS/hvigor/hvigor/package.json"
          cat "$HARMONY_COMMANDLINE_TOOLS/hvigor/hvigor-ohos-plugin/package.json"
          cat "$HARMONY_COMMANDLINE_TOOLS/sdk/default/sdk-pkg.json"
          find "$HARMONY_COMMANDLINE_TOOLS/sdk/default/openharmony" -maxdepth 2 -name '*package*.json' -print -exec cat {} \;
      - name: Build real unsigned HAP (no tests)
        run: node tools/build-hap.mjs --platform '${{ matrix.platform }}' --version-name 0.4.2 --version-code 19
      - uses: actions/upload-artifact@v4
        with:
          name: health2609-${{ matrix.platform }}-unsigned-hap
          path: dist/${{ matrix.platform }}/*
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.ref == 'refs/heads/main'
    needs: hap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: health2609-*-unsigned-hap
          path: hap-assets
      - name: Publish compiler-produced HAPs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find hap-assets -type f \( -name '*.hap' -o -name '*.sha256' \) -exec cp {} release-assets/ \;
          test "$(find release-assets -name '*.hap' | wc -l)" -eq 2
          cp docs/device-install.md release-assets/INSTALL.md
          TAG="v0.4.2-hap.${GITHUB_SHA:0:7}"
          cat > /tmp/hap-notes.md <<'NOTES'
          Real Hvigor release-mode HarmonyOS / OpenHarmony HAPs, unsigned. These are compiler-produced packages, not source archives.
          Huawei commercial HarmonyOS 6 devices require a HarmonyOS certificate and matching profile authorizing the target UDID. OpenHarmony signing is not a substitute. Unsigned packages cannot be installed as distributed.
          Build and source review only; no tests or device validation were run. Full private E2EE journal and historical health data migration remain incomplete on these ports.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" --prerelease --title "一餐一动 0.4.2 · 未签名鸿蒙 / 开鸿 HAP" --notes-file /tmp/hap-notes.md
          fi
