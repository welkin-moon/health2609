name: msdt-bootstrap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/msdt-bootstrap.yml
      - tools/agy-bridge/**
      - prompts/home-meal-analysis.md
      - packages/contracts/src/index.ts

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restart resident AGY bridge on MSDT
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 60 \
            "https://pc-control.20100823.xyz/__h2609_start_bridge_20260929_b73e"
          echo

      - name: Verify public AGY bridge
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            body="$(curl --fail-with-body --silent --show-error --max-time 20 \
              https://h2609-agy.lunarlab.uk/healthz || true)"
            echo "$body"
            if printf '%s' "$body" | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 5
          done
          echo "AGY bridge health check did not become ready" >&2
          exit 1
