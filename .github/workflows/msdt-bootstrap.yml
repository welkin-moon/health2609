name: msdt-bootstrap
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/msdt-bootstrap.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe existing MSDT relay diagnostics
        shell: bash
        run: |
          set -euo pipefail
          for u in \
            "https://pc-control.20100823.xyz/__msdtrepoprobe2_7cfe83b1" \
            "https://pc-control.20100823.xyz/__msdtpreupgrade5_74bd2f61" \
            "https://pc-control.20100823.xyz/__msdtlocalbuild3_12af9e7c"
          do
            echo "===== $u ====="
            curl --fail-with-body --silent --show-error --max-time 40 "$u"
            echo
          done
