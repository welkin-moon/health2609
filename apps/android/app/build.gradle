plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = "uk.lunarlab.health2609"
    compileSdk = 37

    defaultConfig {
        applicationId = "uk.lunarlab.health2609"
        minSdk = 26
        targetSdk = 36
        versionCode = 18
        versionName = "0.4.1"

        def apiBaseUrl = providers.gradleProperty("HEALTH2609_API_BASE_URL").orNull
            ?: "https://h2609.lunarlab.uk/"
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
    }

    signingConfigs {
        def keystorePath = providers.gradleProperty("HEALTH2609_KEYSTORE_PATH").orNull
            ?: System.getenv("HEALTH2609_KEYSTORE_PATH")
        def keystorePasswordValue = providers.gradleProperty("HEALTH2609_KEYSTORE_PASSWORD").orNull
            ?: System.getenv("HEALTH2609_KEYSTORE_PASSWORD")
        def keyAliasValue = providers.gradleProperty("HEALTH2609_KEY_ALIAS").orNull
            ?: System.getenv("HEALTH2609_KEY_ALIAS")
        def keyPasswordValue = providers.gradleProperty("HEALTH2609_KEY_PASSWORD").orNull
            ?: System.getenv("HEALTH2609_KEY_PASSWORD")

        if (keystorePath && keystorePasswordValue && keyAliasValue && keyPasswordValue) {
            release {
                storeFile = file(keystorePath)
                storePassword = keystorePasswordValue
                keyAlias = keyAliasValue
                keyPassword = keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.findByName("release")
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    def composeBom = platform("androidx.compose:compose-bom-alpha:2026.09.00")
    implementation composeBom

    implementation "androidx.activity:activity-compose:1.11.0"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.9.4"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4"
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.datastore:datastore-preferences:1.2.1"
    implementation "androidx.health.connect:connect-client:1.1.0"

    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1"
}
